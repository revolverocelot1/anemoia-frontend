<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Verification</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
            background: #222;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        #canvas-container { 
            margin-top: 20px; 
            border: 2px solid #666; 
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Three.js Module Verification</h1>
    
    <div id="status-container">
        <div class="status">Loading Three.js modules...</div>
    </div>
    
    <div id="canvas-container"></div>

    <script type="module">
        const statusContainer = document.getElementById('status-container');
        const canvasContainer = document.getElementById('canvas-container');
        
        function addStatus(message, isError = false) {
            const div = document.createElement('div');
            div.className = 'status ' + (isError ? 'error' : 'success');
            div.textContent = message;
            statusContainer.appendChild(div);
        }
        
        async function testThreeJS() {
            try {
                // Test WebGL2 support first
                addStatus('Testing WebGL2 support...');
                const testCanvas = document.createElement('canvas');
                const gl2 = testCanvas.getContext('webgl2');
                if (gl2) {
                    addStatus('✓ WebGL2 is supported');
                    const debugInfo = gl2.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        const renderer = gl2.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                        addStatus(`✓ WebGL2 Renderer: ${renderer}`);
                    }
                } else {
                    addStatus('✗ WebGL2 is NOT supported', true);
                }
                
                // Test 1: Import Three.js as ES module
                addStatus('Attempting to import Three.js...');
                const THREE = await import('/node_modules/three/build/three.module.js');
                addStatus('✓ Three.js imported successfully');
                
                // Test 2: Create basic scene
                addStatus('Creating Three.js scene...');
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer();
                
                renderer.setSize(400, 400);
                canvasContainer.appendChild(renderer.domElement);
                
                // Add a cube
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0x00ff00, 
                    wireframe: true 
                });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);
                
                camera.position.z = 5;
                
                addStatus('✓ Scene created successfully');
                
                // Test 3: Render loop
                function animate() {
                    requestAnimationFrame(animate);
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    renderer.render(scene, camera);
                }
                
                animate();
                addStatus('✓ Animation running');
                
                // Test 4: Check WebGL context
                const gl = renderer.getContext();
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    const gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    addStatus(`✓ WebGL Renderer: ${gpu}`);
                }
                
            } catch (error) {
                addStatus(`Error: ${error.message}`, true);
                console.error(error);
            }
        }
        
        // Run the test
        testThreeJS();
    </script>
</body>
</html>
