server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;
    absolute_redirect off;

    # Mandatory COOP/COEP Headers for WebGL & SharedArrayBuffer WASM
    add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    add_header Cross-Origin-Opener-Policy 'same-origin' always;
    add_header Cross-Origin-Resource-Policy 'cross-origin' always;
    add_header Access-Control-Allow-Origin '*' always;

    # Health check endpoint for Coolify and monitoring
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri /index.html;
    }

    # Static assets — immutable caching with required COOP/COEP headers
    location ~* \.(wasm|bin|onnx|m4vgs|ply|off|mp4|json|png|jpg|jpeg|svg|js|css|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cross-Origin-Resource-Policy 'cross-origin' always;
        add_header Access-Control-Allow-Origin '*' always;
    }
}
