<!DOCTYPE html>
<html>
<head>
    <title>Final Whisper Model Test - Visual Confirmation</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #00ff88;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
        }
        
        .status-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .progress-container {
            background: #2a2a2a;
            height: 40px;
            border-radius: 20px;
            overflow: hidden;
            margin: 20px 0;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc66);
            width: 0%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }
        
        .btn {
            background: #00cc66;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }
        
        .btn:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }
        
        /* SUCCESS MODAL - HUGE AND UNMISSABLE */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            z-index: 9999;
        }
        
        .success-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .success-modal {
            background: #00ff88;
            color: #000;
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            animation: bounceIn 0.8s ease;
            box-shadow: 0 0 100px #00ff88;
            max-width: 600px;
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .success-icon {
            font-size: 120px;
            margin-bottom: 20px;
            animation: rotate 1s ease;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .success-title {
            font-size: 36px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .success-message {
            font-size: 20px;
            margin-bottom: 30px;
        }
        
        .log-container {
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        
        .log-success { color: #00ff88; }
        .log-error { color: #ff4444; }
        .log-info { color: #4488ff; }
        .log-warning { color: #ffaa00; }
        
        .error-box {
            background: #ff4444;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        
        .error-box.show {
            display: block;
        }
    </style>
</head>
<body>
    <h1>🚀 Final Whisper Model Loading Test</h1>
    
    <div class="container">
        <div class="status-card">
            <h2>Model Loading Status</h2>
            <p style="font-size: 20px; margin: 20px 0;">
                Current Status: <span id="status" style="color: #00ff88;">Ready to load model</span>
            </p>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress">
                    <span id="progress-text">0%</span>
                </div>
            </div>
            
            <div style="text-align: center;">
                <button class="btn" id="load-btn" onclick="loadModel()">
                    🎯 LOAD WHISPER MODEL
                </button>
                <button class="btn" id="test-simple" onclick="testSimple()">
                    🧪 Simple Test
                </button>
            </div>
        </div>
        
        <div class="error-box" id="error-box"></div>
        
        <div class="status-card">
            <h3>Activity Log</h3>
            <div class="log-container" id="log"></div>
        </div>
    </div>
    
    <!-- MASSIVE SUCCESS MODAL -->
    <div class="success-overlay" id="success-overlay">
        <div class="success-modal">
            <div class="success-icon">✅</div>
            <div class="success-title">MODEL LOADED SUCCESSFULLY!</div>
            <div class="success-message">
                The Whisper AI model has been loaded and is ready for transcription.
                <br><br>
                <strong>VISUAL CONFIRMATION ACHIEVED!</strong>
            </div>
            <button class="btn" onclick="closeSuccess()">Continue</button>
        </div>
    </div>
    
    <script type="module">
        window.log = (message, type = 'info') => {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        };
        
        window.updateProgress = (percent, text) => {
            const bar = document.getElementById('progress');
            const textEl = document.getElementById('progress-text');
            bar.style.width = percent + '%';
            textEl.textContent = text || percent + '%';
        };
        
        window.setStatus = (status, isError = false) => {
            const statusEl = document.getElementById('status');
            statusEl.textContent = status;
            statusEl.style.color = isError ? '#ff4444' : '#00ff88';
        };
        
        window.showError = (error) => {
            const errorBox = document.getElementById('error-box');
            errorBox.textContent = error;
            errorBox.classList.add('show');
            log(error, 'error');
        };
        
        window.showSuccess = () => {
            document.getElementById('success-overlay').classList.add('show');
            log('🎉 VISUAL CONFIRMATION DISPLAYED!', 'success');
        };
        
        window.closeSuccess = () => {
            document.getElementById('success-overlay').classList.remove('show');
        };
        
        // Simple test without worker
        window.testSimple = async () => {
            log('Starting simple inline test...', 'info');
            setStatus('Loading transformers.js...');
            updateProgress(10);
            
            try {
                const { pipeline, env } = await import('@huggingface/transformers');
                log('Transformers.js loaded', 'success');
                
                env.allowRemoteModels = true;
                env.useBrowserCache = true;
                
                updateProgress(20);
                setStatus('Creating pipeline...');
                
                const transcriber = await pipeline(
                    'automatic-speech-recognition',
                    'onnx-community/whisper-tiny',
                    {
                        progress_callback: (p) => {
                            if (p.progress) {
                                updateProgress(20 + (p.progress * 0.8));
                            }
                        }
                    }
                );
                
                updateProgress(100, '100% - Complete!');
                setStatus('✅ Model loaded successfully!');
                showSuccess();
                
            } catch (error) {
                showError(`Simple test failed: ${error.message}`);
                setStatus('❌ Failed to load model', true);
            }
        };
        
        // Main model loading with worker
        window.loadModel = () => {
            log('Starting model load with worker...', 'info');
            setStatus('Initializing worker...');
            updateProgress(0);
            
            document.getElementById('error-box').classList.remove('show');
            
            const worker = new Worker('/src/workers/whisper.worker.ts', { type: 'module' });
            
            worker.addEventListener('message', (event) => {
                const { type, progress, status, error, details } = event.data;
                
                if (type === 'progress') {
                    log(`Progress: ${progress}% - ${status}`, 'info');
                    updateProgress(progress);
                    setStatus(status);
                    
                    // Check for success
                    if (progress === 100 && status.toLowerCase().includes('success')) {
                        log('MODEL LOADED SUCCESSFULLY!', 'success');
                        showSuccess();
                    }
                } else if (type === 'error') {
                    showError(error);
                    setStatus('❌ Failed to load model', true);
                    updateProgress(0);
                }
            });
            
            worker.addEventListener('error', (error) => {
                showError(`Worker error: ${error.message}`);
            });
            
            // Send load command
            log('Sending load-model command to worker...', 'info');
            worker.postMessage({
                type: 'load-model',
                model: 'whisper-tiny',
                options: {
                    cache: true,
                    device: 'wasm'
                }
            });
        };
        
        // Initial setup
        log('Test page ready', 'success');
        log(`Browser: ${navigator.userAgent.substring(0, 50)}...`, 'info');
        log('Click "LOAD WHISPER MODEL" to begin', 'info');
    </script>
</body>
</html>
