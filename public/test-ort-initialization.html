<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONNX Runtime Initialization Test</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        .log {
            background: #000;
            padding: 20px;
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .info { color: #74c0fc; }
        .warning { color: #ffd43b; }
        button {
            background: #4c6ef5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #364fc7;
        }
        button:disabled {
            background: #495057;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>ONNX Runtime Initialization Test</h1>
    
    <div>
        <button id="testWasm">Test WASM Files</button>
        <button id="testOrt">Test ONNX Runtime</button>
        <button id="testWorker">Test Whisper Worker</button>
        <button id="clearLogs">Clear Logs</button>
    </div>
    
    <div id="log" class="log"></div>

    <script>
        const logDiv = document.getElementById('log');
        let worker = null;
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        // Test WASM files accessibility
        document.getElementById('testWasm').addEventListener('click', async () => {
            log('Testing WASM files accessibility...');
            
            const wasmFiles = [
                'ort-wasm.wasm',
                'ort-wasm-simd.wasm',
                'ort-wasm-threaded.wasm',
                'ort-wasm-simd-threaded.wasm'
            ];
            
            for (const file of wasmFiles) {
                try {
                    const url = `/ort-wasm/${file}`;
                    const response = await fetch(url, { method: 'HEAD' });
                    
                    if (response.ok) {
                        log(`✓ ${file} is accessible`, 'success');
                    } else {
                        log(`✗ ${file} returned ${response.status}`, 'error');
                    }
                } catch (error) {
                    log(`✗ ${file} failed: ${error.message}`, 'error');
                }
            }
        });
        
        // Test ONNX Runtime loading
        document.getElementById('testOrt').addEventListener('click', async () => {
            log('Testing ONNX Runtime loading...');
            
            try {
                // Set up ORT environment
                log('Setting up ORT environment...');
                window.ort = {
                    env: {
                        wasm: {
                            wasmPaths: window.location.origin + '/ort-wasm/',
                            numThreads: navigator.hardwareConcurrency || 4,
                            simd: true
                        },
                        logLevel: 'verbose',
                        debug: true
                    }
                };
                
                log('Loading ONNX Runtime module...');
                const ort = await import('/node_modules/onnxruntime-web/dist/ort.es6.min.js');
                
                if (ort && ort.env) {
                    log('✓ ONNX Runtime loaded successfully', 'success');
                    
                    // Test tensor creation
                    log('Testing tensor creation...');
                    const testData = new Float32Array([1, 2, 3, 4]);
                    const testTensor = new ort.Tensor('float32', testData, [2, 2]);
                    
                    if (testTensor) {
                        log('✓ Tensor creation successful', 'success');
                        log(`Tensor shape: [${testTensor.dims}]`, 'info');
                    }
                    
                    // Check available providers
                    log('Checking execution providers...', 'info');
                    log(`WASM paths: ${ort.env.wasm.wasmPaths}`, 'info');
                } else {
                    log('✗ ONNX Runtime loaded but missing expected properties', 'error');
                }
            } catch (error) {
                log(`✗ Failed to load ONNX Runtime: ${error.message}`, 'error');
                log(`Stack trace: ${error.stack}`, 'error');
            }
        });
        
        // Test Whisper Worker
        document.getElementById('testWorker').addEventListener('click', async () => {
            log('Testing Whisper Worker...');
            
            if (worker) {
                log('Terminating existing worker...', 'warning');
                worker.terminate();
            }
            
            try {
                log('Creating new worker...');
                worker = new Worker('/src/workers/whisper.worker.ts', { type: 'module' });
                
                worker.addEventListener('error', (event) => {
                    log(`Worker error: ${event.message}`, 'error');
                });
                
                worker.addEventListener('message', (event) => {
                    const { type, progress, status, error, details } = event.data;
                    
                    if (type === 'progress') {
                        log(`Progress: ${progress}% - ${status}`, 'info');
                    } else if (type === 'error') {
                        log(`Worker error: ${error}`, 'error');
                        if (details) {
                            log(`Details: ${JSON.stringify(details, null, 2)}`, 'error');
                        }
                    } else if (type === 'result') {
                        log('✓ Worker ready!', 'success');
                    } else {
                        log(`Worker message: ${JSON.stringify(event.data)}`, 'info');
                    }
                });
                
                log('✓ Worker created successfully', 'success');
                
                // Wait a bit for initialization messages
                setTimeout(() => {
                    log('Sending load-model message...', 'info');
                    worker.postMessage({
                        type: 'load-model',
                        model: 'whisper-tiny'
                    });
                }, 1000);
                
            } catch (error) {
                log(`✗ Failed to create worker: ${error.message}`, 'error');
            }
        });
        
        // Clear logs
        document.getElementById('clearLogs').addEventListener('click', () => {
            logDiv.innerHTML = '';
            log('Logs cleared', 'info');
        });
        
        // Initial log
        log('ONNX Runtime Initialization Test Page Ready', 'success');
        log(`Browser: ${navigator.userAgent}`, 'info');
        log(`Hardware concurrency: ${navigator.hardwareConcurrency || 'unknown'}`, 'info');
        log(`WebAssembly support: ${typeof WebAssembly !== 'undefined' ? 'yes' : 'no'}`, 'info');
    </script>
</body>
</html>
