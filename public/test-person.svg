<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple stick figure person -->
  <!-- Head -->
  <circle cx="100" cy="60" r="30" fill="#FFB6C1" stroke="#333" stroke-width="2"/>
  <!-- Body -->
  <line x1="100" y1="90" x2="100" y2="200" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="100" y1="120" x2="60" y2="160" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="140" y2="160" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="100" y1="200" x2="70" y2="280" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="200" x2="130" y2="280" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="70" cy="290" rx="15" ry="8" fill="#333"/>
  <ellipse cx="130" cy="290" rx="15" ry="8" fill="#333"/>
  <!-- Face -->
  <circle cx="85" cy="55" r="3" fill="#333"/>
  <circle cx="115" cy="55" r="3" fill="#333"/>
  <path d="M 85 70 Q 100 75 115 70" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
