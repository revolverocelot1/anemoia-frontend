<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - Anemoia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        
        #canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 24px;
            z-index: 10;
        }
        
        #progress {
            width: 300px;
            height: 20px;
            background: #222;
            border: 2px solid #666;
            margin: 20px auto;
        }
        
        #progress-fill {
            height: 100%;
            background: #ff0000;
            width: 0%;
            transition: width 0.3s;
        }
        
        .controls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 20;
            display: none;
        }
        
        .control-btn {
            padding: 8px 16px;
            background: rgba(255, 0, 0, 0.8);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 5px;
        }
        
        .control-btn:hover {
            background: rgba(255, 0, 0, 1);
        }
        
        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            color: #ff6666;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ff0000;
            border-radius: 10px;
        }
        
        /* Hide the default canvas until properly initialized */
        canvas:not(#canvas) {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <div id="loading">
        <div>Loading DOOM...</div>
        <div id="progress">
            <div id="progress-fill"></div>
        </div>
        <div id="status">Initializing...</div>
    </div>
    
    <div id="error" class="error">
        <h3>Error Loading DOOM</h3>
        <p id="error-message"></p>
        <button class="control-btn" onclick="location.reload()">Retry</button>
    </div>
    
    <div class="controls" id="controls">
        <button class="control-btn" onclick="toggleFullscreen()">Fullscreen</button>
        <button class="control-btn" onclick="exitGame()">Exit</button>
    </div>

    <script>
        let statusElement = document.getElementById('status');
        let progressElement = document.getElementById('progress-fill');
        let loadingElement = document.getElementById('loading');
        let controlsElement = document.getElementById('controls');
        let errorElement = document.getElementById('error');
        let errorMessageElement = document.getElementById('error-message');
        
        function updateProgress(percent) {
            progressElement.style.width = percent + '%';
        }
        
        function showError(message) {
            loadingElement.style.display = 'none';
            errorElement.style.display = 'block';
            errorMessageElement.textContent = message;
            console.error('DOOM Error:', message);
        }
        
        function toggleFullscreen() {
            const canvas = document.getElementById('canvas');
            if (!document.fullscreenElement) {
                canvas.requestFullscreen().catch(err => {
                    console.error('Error attempting fullscreen:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        function exitGame() {
            if (window.parent !== window) {
                // We're in an iframe, send message to parent
                window.parent.postMessage({ action: 'exitDoom' }, '*');
            } else {
                // Try to go back or close
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            }
        }
        
        // Module configuration for Emscripten
        var Module = {
            preRun: [],
            postRun: [],
            
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                
                // As a default initial behavior, pop up an alert when webgl context is lost.
                canvas.addEventListener("webglcontextlost", function(e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                
                return canvas;
            })(),
            
            print: function(text) {
                console.log(text);
            },
            
            printErr: function(text) {
                console.error(text);
            },
            
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                
                if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                
                if (m) {
                    text = m[1];
                    updateProgress((parseInt(m[2]) / parseInt(m[4])) * 100);
                } else {
                    updateProgress(100);
                }
                
                statusElement.innerHTML = text;
            },
            
            totalDependencies: 0,
            
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
                
                if (left === 0) {
                    // Hide loading screen and show controls
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                        controlsElement.style.display = 'block';
                    }, 500);
                }
            }
        };
        
        Module.setStatus('Downloading...');
        
        window.onerror = function(msg, url, line, col, error) {
            showError(msg);
            return false;
        };
        
        // Load the DOOM script
        var script = document.createElement('script');
        script.src = 'doom1.js';
        script.onerror = function() {
            showError('Failed to load DOOM engine. Please ensure all files are present.');
        };
        document.body.appendChild(script);
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
