<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - Anemoia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 4/3;
            background: #000;
        }
        
        #doom-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 24px;
        }
        
        #progress-bar {
            width: 300px;
            height: 20px;
            background: #222;
            border: 2px solid #666;
            margin: 20px auto;
        }
        
        #progress-fill {
            height: 100%;
            background: #ff0000;
            width: 0%;
            transition: width 0.3s;
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .control-btn {
            margin: 0 5px;
            padding: 5px 10px;
            background: #333;
            border: 1px solid #666;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
        }
        
        .control-btn:hover {
            background: #444;
        }
        
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            max-width: 80%;
        }
        
        .error-message {
            color: #ff6666;
            margin-bottom: 20px;
        }
        
        .fullscreen-notice {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="doom-canvas"></canvas>
        
        <div id="loading">
            <div>Loading DOOM...</div>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="status">Initializing...</div>
        </div>
        
        <div id="error">
            <div class="error-message">Failed to load DOOM</div>
            <div id="error-details"></div>
            <button class="control-btn" onclick="location.reload()">Retry</button>
            <button class="control-btn" onclick="window.close()">Close</button>
        </div>
        
        <div id="controls">
            <button class="control-btn" onclick="toggleFullscreen()">Fullscreen</button>
            <button class="control-btn" onclick="toggleSound()">Toggle Sound</button>
            <button class="control-btn" onclick="window.close()">Exit</button>
        </div>
        
        <div class="fullscreen-notice">Press F11 for fullscreen</div>
    </div>

    <script>
        let gameModule = null;
        let soundEnabled = true;
        
        function updateProgress(percent) {
            document.getElementById('progress-fill').style.width = percent + '%';
        }
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-details').textContent = message;
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('controls').style.display = 'block';
        }
        
        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error('Failed to enter fullscreen:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            if (gameModule && gameModule.setSound) {
                gameModule.setSound(soundEnabled);
            }
        }
        
        // Module configuration for Emscripten
        var Module = {
            canvas: document.getElementById('doom-canvas'),
            preRun: [],
            postRun: [],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            onRuntimeInitialized: function() {
                console.log('DOOM Runtime initialized');
                hideLoading();
            },
            setStatus: function(text) {
                if (!text) return;
                updateStatus(text);
                
                // Parse progress from status messages
                const m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) {
                    const current = parseFloat(m[1]);
                    const total = parseFloat(m[3]);
                    const percent = (current / total) * 100;
                    updateProgress(percent);
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                if (left === 0) {
                    updateProgress(100);
                    updateStatus('Ready!');
                } else {
                    const percent = ((this.totalDependencies - left) / this.totalDependencies) * 100;
                    updateProgress(percent);
                    updateStatus(`Loading... (${this.totalDependencies - left}/${this.totalDependencies})`);
                }
            }
        };
        
        // Handle window resize
        window.addEventListener('resize', () => {
            if (gameModule && gameModule.setCanvasSize) {
                const canvas = document.getElementById('doom-canvas');
                gameModule.setCanvasSize(canvas.clientWidth, canvas.clientHeight);
            }
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            }
        });
        
        // Load DOOM using the loader script
        updateStatus('Loading DOOM engine...');
        
        // Create script element to load the DOOM loader
        const script = document.createElement('script');
        script.src = 'doom-loader.js';
        script.onerror = () => {
            showError('Failed to load DOOM loader. Please check your internet connection and try again.');
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
