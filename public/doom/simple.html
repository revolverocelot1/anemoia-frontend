<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - Anemoia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        
        #doom-frame {
            width: 100vw;
            height: 100vh;
            border: none;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-align: center;
            z-index: 10;
            background: #000;
            padding: 20px;
            border-radius: 10px;
        }
        
        .controls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 20;
        }
        
        .control-btn {
            padding: 8px 16px;
            background: rgba(255, 0, 0, 0.8);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 5px;
        }
        
        .control-btn:hover {
            background: rgba(255, 0, 0, 1);
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div>Loading DOOM...</div>
        <div style="margin-top: 10px; font-size: 14px; color: #888;">Please wait, this may take a moment.</div>
    </div>
    
    <iframe 
        id="doom-frame"
        src="https://dos.zone/doom-dec-1993/"
        allow="fullscreen; autoplay; gamepad"
        onload="onDoomLoad()"
        class="hidden"
    ></iframe>
    
    <div class="controls hidden" id="controls">
        <button class="control-btn" onclick="toggleFullscreen()">Fullscreen</button>
        <button class="control-btn" onclick="exitGame()">Exit</button>
    </div>

    <script>
        function onDoomLoad() {
            // Hide loading screen and show the game
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('doom-frame').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
        }
        
        function toggleFullscreen() {
            const iframe = document.getElementById('doom-frame');
            if (!document.fullscreenElement) {
                iframe.requestFullscreen().catch(err => {
                    console.error('Error attempting fullscreen:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        function exitGame() {
            if (window.parent !== window) {
                // We're in an iframe, send message to parent
                window.parent.postMessage({ action: 'exitDoom' }, '*');
            } else {
                // Close window or go back
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            }
        }
        
        // Listen for keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            } else if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
