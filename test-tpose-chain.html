<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Pose Chain Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .result {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .result img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .result h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        .status {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .status.success { background: #4CAF50; }
        .status.error { background: #f44336; }
        .status.loading { background: #ff9800; }
        #controls {
            margin-bottom: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #log {
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>T-Pose Conversation Chain Test</h1>
    
    <div id="controls">
        <input type="file" id="fileInput" accept="image/*">
        <button id="startBtn" onclick="startProcess()">Start T-Pose Generation</button>
        <div id="conversationId" style="margin-top: 10px;"></div>
    </div>

    <div class="container">
        <div class="result">
            <h3>Original</h3>
            <div id="original-status" class="status">Waiting</div>
            <img id="original-img" style="display: none;">
        </div>
        <div class="result">
            <h3>Front (T-Pose)</h3>
            <div id="front-status" class="status">Waiting</div>
            <img id="front-img" style="display: none;">
        </div>
        <div class="result">
            <h3>60° Rotation</h3>
            <div id="60-status" class="status">Waiting</div>
            <img id="60-img" style="display: none;">
        </div>
        <div class="result">
            <h3>90° Rotation</h3>
            <div id="90-status" class="status">Waiting</div>
            <img id="90-img" style="display: none;">
        </div>
        <div class="result">
            <h3>180° Rotation</h3>
            <div id="180-status" class="status">Waiting</div>
            <img id="180-img" style="display: none;">
        </div>
    </div>

    <div id="log"></div>

    <script>
        let conversationId = null;
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function startProcess() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select an image file');
                return;
            }

            // Display original image
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('original-img').src = e.target.result;
                document.getElementById('original-img').style.display = 'block';
                document.getElementById('original-status').className = 'status success';
                document.getElementById('original-status').textContent = 'Loaded';
            };
            reader.readAsDataURL(file);

            // Start with front view
            await processRotation('front', file, null, false);
        }

        async function processRotation(rotation, file, convId, isContinuation) {
            const statusEl = document.getElementById(`${rotation}-status`);
            const imgEl = document.getElementById(`${rotation}-img`);
            
            statusEl.className = 'status loading';
            statusEl.textContent = 'Processing...';
            
            log(`Starting ${rotation} rotation...`);

            const formData = new FormData();
            
            // Set prompts based on rotation
            const prompts = {
                'front': 'I need you to remember every single detail about this person - their exact face shape, facial features, skin tone, hair color and style, body proportions, clothing details, and any accessories. Transform this person into a perfect T-pose: arms extended horizontally at exactly 90 degrees from the body, legs straight and together, neutral expression, looking straight ahead. The entire body must be visible in the frame. This is extremely important: maintain 100% accuracy of all physical features and clothing.',
                '60': 'now 60 degrees',
                '90': 'now 90 degrees',
                '180': 'now 180 degrees'
            };

            formData.append('prompt', prompts[rotation]);
            formData.append('input_mime_type', file ? file.type : 'image/png');
            formData.append('output_mime_type', 'image/png');
            
            if (convId) {
                formData.append('conversation_id', convId);
                log(`Using conversation ID: ${convId}`);
            }
            
            formData.append('is_continuation', isContinuation ? 'true' : 'false');
            log(`Is continuation: ${isContinuation}`);
            
            if (!isContinuation && file) {
                formData.append('image', file);
                log('Appending image file');
            }

            try {
                const response = await fetch('http://localhost:8000/api/gemini/image-edit', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                log(`Response received for ${rotation}`);
                
                // Display the image
                imgEl.src = `data:image/png;base64,${data.image_base64}`;
                imgEl.style.display = 'block';
                statusEl.className = 'status success';
                statusEl.textContent = 'Complete';
                
                // Store conversation ID from first response
                if (!conversationId && data.conversation_id) {
                    conversationId = data.conversation_id;
                    document.getElementById('conversationId').textContent = `Conversation ID: ${conversationId}`;
                    log(`Conversation started with ID: ${conversationId}`);
                }

                // Process next rotation
                const rotations = ['front', '60', '90', '180'];
                const currentIndex = rotations.indexOf(rotation);
                if (currentIndex < rotations.length - 1) {
                    const nextRotation = rotations[currentIndex + 1];
                    setTimeout(() => {
                        processRotation(nextRotation, null, conversationId, true);
                    }, 1000);
                } else {
                    log('All rotations complete!');
                }

            } catch (error) {
                log(`Error processing ${rotation}: ${error.message}`);
                statusEl.className = 'status error';
                statusEl.textContent = 'Failed';
            }
        }
    </script>
</body>
</html>
