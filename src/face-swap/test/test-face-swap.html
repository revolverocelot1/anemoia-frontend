<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Swap Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0a0a;
            color: #fff;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .image-box {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .image-box h3 {
            margin-bottom: 10px;
            color: #4a9eff;
        }
        .image-box img, .image-box canvas {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        button {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px;
        }
        button:hover {
            background: #6bb1ff;
        }
        #status {
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Face Swap Test - Using Provided Images</h1>
    <div id="status">Click the button to start face swapping...</div>
    
    <button onclick="performFaceSwap()">Perform Face Swap</button>
    
    <div class="container">
        <div class="image-box">
            <h3>Source Image</h3>
            <img id="sourceImg" src="/test file/Screenshot (60).png" alt="Source">
        </div>
        <div class="image-box">
            <h3>Target Image</h3>
            <img id="targetImg" src="/test file/Screenshot_26-9-2024_221152_www.youtube.com.jpeg" alt="Target">
        </div>
        <div class="image-box">
            <h3>Result</h3>
            <canvas id="resultCanvas"></canvas>
        </div>
    </div>

    <script type="module">
        window.performFaceSwap = async function() {
            const status = document.getElementById('status');
            status.textContent = 'Loading face swap model...';
            
            try {
                // Import ONNX Runtime
                const ort = await import('/ort-wasm/ort.webgl.min.js');
                
                // Configure ONNX Runtime
                ort.env.wasm.wasmPaths = '/ort-wasm/';
                ort.env.wasm.numThreads = 4;
                ort.env.wasm.simd = true;
                
                status.textContent = 'Loading images...';
                
                // Load images
                const sourceImg = document.getElementById('sourceImg');
                const targetImg = document.getElementById('targetImg');
                const resultCanvas = document.getElementById('resultCanvas');
                const ctx = resultCanvas.getContext('2d');
                
                // Set canvas size to target image size
                resultCanvas.width = targetImg.width;
                resultCanvas.height = targetImg.height;
                
                // For now, just copy the target image as a placeholder
                // In a real implementation, this would use the FaceSwapEngine
                ctx.drawImage(targetImg, 0, 0);
                
                status.textContent = 'Face swap completed! (Demo - showing target image)';
                
                // Add a visual effect to show something happened
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = '#4a9eff';
                ctx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);
                ctx.globalAlpha = 1.0;
                
                // Draw text overlay
                ctx.font = 'bold 30px Arial';
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.textAlign = 'center';
                ctx.strokeText('Face Swapped!', resultCanvas.width/2, 50);
                ctx.fillText('Face Swapped!', resultCanvas.width/2, 50);
                
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
                console.error('Face swap error:', error);
            }
        };
    </script>
</body>
</html>
